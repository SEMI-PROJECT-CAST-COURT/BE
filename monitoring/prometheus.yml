# 전역 설정
global:
  # 기본 수집 주기. 15초마다 각 대상의 지표를 한 번씩 가져온다.
  #  [주의!] 수집 주기보다 짧게 일어난 사건은 관측되지 않는다.
  #  3초간 치솟았다 가라앉은 값은 15초 주기로는 보이지 않을 수 있다.
  scrape_interval: 15s

  # 알림 규칙(alert-rules.yml)을 몇 초마다 다시 계산할지 지정한다.
  evaluation_interval: 15s

  # 이 프로메테우스가 모은 모든 지표에 붙는 라벨 (프로메테우스가 여러 대일 때 출처 구분용)
  external_labels:
    monitor: 'cast-court-local'

# 알림 규칙 파일 (이 파일 기준 상대 경로)
#  [주의!] 규칙이 걸려도 실제로 알림을 보내려면 Alertmanager 가 따로 필요하다.
#  여기서는 프로메테우스 화면의 Alerts 탭에서 규칙이 걸리는 것까지만 확인한다.
#  메신저 · 메일 알림이 필요하면 규칙의 PromQL 을 그라파나 알림 규칙으로 옮겨 쓴다.
rule_files:
  - 'alert-rules.yml'

# 수집 대상
scrape_configs:

  # 프로메테우스 자기 자신 (메타 모니터링)
  # 감시 도구가 죽으면 아무 알림도 오지 않아 조용한 상태가 정상처럼 보이기 때문에 습관처럼 넣어 둔다.
  - job_name: 'prometheus'
    static_configs:
      - targets: ['localhost:9090']

  # Cast Court API
  #  [주의!] job 이름은 alert-rules.yml 과 grafana-dashboard.json 의 job="cast-court" 와 같아야 한다.
  #   여기만 바꾸면 대시보드와 알림이 전부 비어 버린다.
  - job_name: 'cast-court'

    # 스프링 부트 액추에이터의 지표 경로. 프로메테우스 기본값은 /metrics 이므로 반드시 적는다.
    metrics_path: '/actuator/prometheus'

    # 이 대상만 5초마다 수집한다. 로컬에서 재판을 진행하며 그래프가 바로 움직이는 것을 보기 위한 값이다.
    #  [주의!] 수집 요청도 http_server_requests 에 /actuator/prometheus 로 잡힌다 (5초마다 1건 = 초당 0.2건).
    #   그래서 대시보드의 요청 수 · 응답 시간 패널은 /actuator 로 시작하는 주소를 빼고 계산한다.
    scrape_interval: 5s

    static_configs:
      # IntelliJ 에서 실행 중인 앱 (actuator 는 앱과 같은 8080 포트를 쓴다)
      - targets: [ '192.168.0.62:8080' ]
        labels:
          instance: '박찬웅'
      - targets: [ '192.168.10.26:8080' ]
        labels:
          instance: '이규원'
      - targets: [ '192.168.0.47:8080' ]
        labels:
          instance: '권도연'
      - targets: [ '192.168.10.34:8080' ]
        labels:
          instance: '윤지성'